[project]
name = "petstore-assistant"
version = "1.0.0"
description = "MCP server for JPetStore support chatbot"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "openai>=1.0.0",
]

[project.scripts]
petstore-assistant = "petstore_assistant.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
